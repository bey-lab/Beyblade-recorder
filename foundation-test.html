<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BEY LAB | パーツ管理実験 V10</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081324;color:#f0f5ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:950px;margin:auto;padding:16px 14px 70px}a{color:#9ac9ff}h1{font-size:25px;margin:14px 0 5px}h2{font-size:19px;margin:0 0 12px}.sub{color:#a6b8d0;font-size:13px;line-height:1.6}.panel{border:1px solid #39516e;background:#11243c;border-radius:16px;padding:15px;margin-top:14px}button,input,select{font:inherit;color:inherit}button{border:1px solid #587292;background:#1b3657;border-radius:10px;padding:11px 13px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}button.active{background:#205d99;border:2px solid #8cd6ff;padding:10px 12px}button:focus-visible{outline:3px solid #ffce6d}input,select{background:#09182a;border:1px solid #607a9b;border-radius:9px;padding:12px;min-width:0}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.line select{flex:1;min-width:130px}.line input{flex:2;min-width:140px}.pick-grid{display:flex;flex-wrap:wrap;gap:7px;max-height:270px;overflow:auto;padding:2px}.pick-grid button{min-width:65px}.pick-grid button:disabled{opacity:.6}.part-title{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-weight:800}.picked{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.picked>div{background:#09182a;border:1px solid #3a5878;border-radius:11px;padding:12px 6px;text-align:center;min-width:0}.picked small{display:block;color:#a9c2e0;margin-bottom:5px}.picked strong{font-size:clamp(12px,2.8vw,18px);overflow-wrap:anywhere}.save{width:100%;margin-top:12px;background:#14644f;border-color:#43b99a;font-weight:800;font-size:17px}.save:disabled{opacity:.4}.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px}.preset{display:flex;align-items:stretch;gap:6px;border:1px solid #3e5b7d;border-radius:11px;padding:6px;background:#0b1b30}.preset .load{flex:1;text-align:left;background:#1b3858;border:0;min-width:0}.preset .load strong{display:block}.preset .load small{display:block;color:#c0d3ec;margin-top:3px}.preset .remove{background:#49303a;border-color:#8a5661;padding:8px}#status{min-height:1.6em;color:#8fe5c6;font-weight:700}.tag{font-size:12px;color:#ffdd99}.empty{color:#91a8c5}.poolnote{color:#a5bdd9;font-size:12px;margin:6px 0}.part-add{display:flex;gap:7px;margin:10px 0 4px}.part-add input{flex:1;min-width:0}.ratchet-group{margin:8px 0 12px}.ratchet-label{color:#a9c5e7;font-size:13px;font-weight:800;margin-bottom:6px}.ratchet-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.ratchet-grid button{min-width:0;padding:11px 3px}.hand-buttons{display:flex;flex-wrap:wrap;gap:7px}.hand-buttons button{min-height:42px}.inventory-toggle{width:100%;text-align:left;background:#1a3552;font-weight:750}.inventory-box{margin-top:10px;padding:10px;background:#0a1b30;border:1px solid #355475;border-radius:12px}.inventory-note{font-size:12px;color:#b3c9e3;margin:5px 0 12px}.add-grid{display:flex;flex-wrap:wrap;gap:6px}.add-grid button{padding:9px 11px}.add-grid button.owned{border-color:#65bfa7;color:#9ce8ce}.add-grid button,.ratchet-grid button{background:#172337;border:1px solid #465369;color:#b7c3d2;box-shadow:none}
.add-grid button.owned,.ratchet-grid button.owned{background:#124e42;border:2px solid #65d6a8;color:#e2fff1;font-weight:800;box-shadow:inset 0 0 0 1px #174f43}
.add-grid button:not(.owned):active,.ratchet-grid button:not(.owned):active{background:#29405c}
.hand-buttons button.active{background:#1764a8;border:2px solid #92dcff;color:#fff;box-shadow:0 0 0 2px #0a2740}
.inventory-note{line-height:1.6}
.back{display:inline-block;margin:7px 0} @media(max-width:420px){.panel{padding:11px}.pick-grid button{padding:10px 9px;min-width:57px}}
</style></head><body><main><a class="back" href="./index.html">← ホームへ</a><h1>🔧 手札基礎実験</h1><p class="sub">試作版。本体の手札・試合・保存済みカスタムは変更しません。ここで作ったデータは試作用の別保存です。</p>
<section class="panel"><h2>① プレイヤー</h2><div class="line"><select id="player" aria-label="プレイヤー"></select><input id="newPlayer" placeholder="新しいプレイヤー名" maxlength="70"><button id="addPlayer">＋ 追加</button></div></section>
<section class="panel"><h2>② パーツ管理</h2><p class="sub">プレイヤーごとのパーツを登録・解除。普段は閉じておけます。</p><div id="handSummary" class="inventory-note"></div><button id="inventoryToggle" class="inventory-toggle" type="button" aria-expanded="false">＋ パーツを編集する ▾</button><div id="inventoryBox" class="inventory-box" hidden></div></section>
<section class="panel"><h2>③ 完成ベイを組む</h2><p class="sub">登録した手札からワンタップでパーツを選択。</p><div class="picked" id="picked"></div><div id="partPickers"></div><button class="save" id="save">＋ この一式を保存</button><p id="status" role="status"></p></section>
<section class="panel"><h2>④ 保存済み完成ベイ <span id="count" class="tag"></span></h2><p class="sub">機体をタップすると、上の3つのパーツ欄へ一括で戻ります。</p><div id="presets" class="presets"></div></section>
<p class="sub">この実験は端末内の localStorage を使います。ブラウザや端末を変えると共有されません。</p></main>
<script src="./bey-hands.js"></script><script>
(()=>{
"use strict";
const KEY="bey-lab-foundation-prototype-v1", parts=["blade","ratchet","bit"],labels={blade:"ブレード",ratchet:"ラチェット",bit:"ビット"};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function read(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==="object"&&!Array.isArray(x)?x:{}}catch(e){return {}}}
function write(d){localStorage.setItem(KEY,JSON.stringify(d))}
function clean(s){return String(s||"").trim().slice(0,70)}
const state={player:"",selection:{blade:"",ratchet:"",bit:""}};
function names(){return [...new Set([...Object.keys(read()),...(window.BEY_HANDS?.players?.()||[])])].filter(Boolean).sort((a,b)=>a.localeCompare(b,"ja"))}
function natural(a,b){return a.localeCompare(b,"ja",{numeric:true,sensitivity:"base"})}
const DEFAULT_PARTS={ratchet:["1-60","2-60","3-60","4-60","5-60","6-60","7-60","8-60","9-60","1-70","2-70","3-70","4-70","5-70","6-70","7-70","8-70","9-70","1-80","2-80","3-80","4-80","5-80","6-80","7-80","8-80","9-80","1-50","2-50","3-50","4-50","5-50","6-50","7-50","8-50","9-50"],bit:["R","F","B","T","H","C","A","GF","FB","LR","N","P","LF","E","S","L","D","O","HN","U","UN","MN","G","Q","K","W","HT","DB","GN"]};
function options(part){const d=read();const all=new Set([...(DEFAULT_PARTS[part]||[]),...(window.BEY_HANDS?.pool?.(part)||[]),...(d.customParts?.[part]||[])]);for(const p of Object.values(d))for(const v of p?.presets||[])if(v?.[part])all.add(v[part]);const arr=[...all].filter(Boolean);return arr.sort(part==="ratchet"?(a,b)=>{const x=/^(\\d+)-(\\d+)$/.exec(a),y=/^(\\d+)-(\\d+)$/.exec(b);return x&&y?Number(x[1])-Number(y[1])||Number(x[2])-Number(y[2]):x?-1:y?1:natural(a,b)}:natural)}

function playerData(){return read()[state.player]||{presets:[],hand:{}}}
function hand(part){const h=playerData().hand?.[part];return Array.isArray(h)?[...new Set(h.filter(x=>typeof x==="string"&&x))].sort(part==="ratchet"?ratchetSort:natural):[]}
function ratchetSort(a,b){const x=/^(\d+)-(\d+)$/.exec(a),y=/^(\d+)-(\d+)$/.exec(b);return x&&y?Number(x[1])-Number(y[1])||Number(x[2])-Number(y[2]):x?-1:y?1:natural(a,b)}
function seedHand(player){const d=read();d[player]??={presets:[]};if(d[player].hand)return;const h={blade:[],ratchet:[],bit:[]};for(const p of d[player].presets||[])for(const part of parts)if(p[part]&&!h[part].includes(p[part]))h[part].push(p[part]);d[player].hand=h;try{write(d)}catch(e){$("status").textContent="手札の初期化に失敗: "+e.message}}
function setPlayer(p){state.player=p;state.selection={blade:"",ratchet:"",bit:""};if(p)seedHand(p);render();$("status").textContent=""}
function renderPlayers(){const select=$("player"),list=names();const existing=[...select.options].map(o=>o.value);if(existing.length!==list.length||existing.some((v,i)=>v!==list[i]))select.innerHTML=list.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");if(select.value!==state.player)select.value=state.player}
function renderPicked(){$("picked").innerHTML=parts.map(p=>'<div><small>'+labels[p]+'</small><strong>'+esc(state.selection[p]||"未選択")+'</strong></div>').join("");$("save").disabled=!state.player||parts.some(p=>!state.selection[p])}
function choiceButton(part,v){return '<button type="button" data-part="'+part+'" data-value="'+esc(v)+'" class="'+(state.selection[part]===v?"active":"")+'" aria-pressed="'+(state.selection[part]===v)+'">'+(state.selection[part]===v?"✓ ":"")+esc(v)+'</button>'}
function renderParts(){
 $("partPickers").innerHTML=parts.map(part=>{
 const vals=hand(part),selected=state.selection[part];
 const extra=selected&&!vals.includes(selected)?'<p class="inventory-note">呼び出した機体のパーツ（手札未登録）：'+esc(selected)+'　<button type="button" data-part="'+part+'" data-value="'+esc(selected)+'" class="active">'+esc(selected)+'</button></p>':"";
 return '<div class="part-title"><span>'+labels[part]+'</span><small class="tag">手札 '+vals.length+'種類</small></div><div class="hand-buttons">'+(vals.length?vals.map(v=>choiceButton(part,v)).join(""):'<span class="empty">未登録です。下の「手札に追加」から登録してください。</span>')+'</div>'+extra;
 }).join("")
}
function renderInventory(){
 $("handSummary").textContent=state.player?parts.map(p=>labels[p]+" "+hand(p).length+"種類").join(" ／ "):"プレイヤーを選択してください";
 const box=$("inventoryBox");if(box.hidden)return;
 box.innerHTML='<p class="inventory-note">タップでこのプレイヤーの手札に追加・解除。✓ は登録済み。完成ベイの保存データは削除されません。</p>'+parts.map(part=>{
 const current=new Set(hand(part)),vals=options(part);
 let body;
 if(part==="ratchet"){
 const groups=new Map();for(const v of vals){const m=/^(\d+)-(\d+)$/.exec(v),k=m?m[1]:"その他";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(v)}
 body=[...groups].map(([k,items])=>'<div class="ratchet-group"><div class="ratchet-label">'+esc(k)+(k==="その他"?"":" 系")+'</div><div class="ratchet-grid">'+items.map(v=>inventoryButton(part,v,current)).join("")+'</div></div>').join("");
 }else body='<div class="add-grid">'+vals.map(v=>inventoryButton(part,v,current)).join("")+'</div>';
 return '<div class="part-title"><span>'+labels[part]+'</span><small class="tag">登録済み '+current.size+'</small></div>'+body+'<div class="part-add"><input data-newpart="'+part+'" maxlength="70" placeholder="一覧にない'+labels[part]+'を入力"><button type="button" data-addpart="'+part+'">＋ 新規登録</button></div>'
 }).join("")
}
function inventoryButton(part,v,current){return '<button type="button" data-togglepart="'+part+'" data-value="'+esc(v)+'" class="'+(current.has(v)?"owned":"")+'" aria-pressed="'+current.has(v)+'">'+(current.has(v)?"✓ ":"＋ ")+esc(v)+'</button>'}
function updateHand(part,value,forceAdd=false){if(!state.player)return;const d=read();d[state.player]??={presets:[]};d[state.player].hand??={};const h=new Set(d[state.player].hand[part]||[]);if(h.has(value)&&!forceAdd)h.delete(value);else h.add(value);d[state.player].hand[part]=[...h];try{write(d);renderParts();if(forceAdd){renderInventory()}else{for(const b of $("inventoryBox").querySelectorAll("button[data-togglepart]"))if(b.dataset.togglepart===part&&b.dataset.value===value){b.classList.toggle("owned",h.has(value));b.setAttribute("aria-pressed",String(h.has(value)));b.textContent=(h.has(value)?"✓ ":"＋ ")+value}const section=$("inventoryBox").querySelector('input[data-newpart="'+part+'"]')?.parentElement?.parentElement;const counter=section?.querySelector(".part-title .tag");if(counter)counter.textContent="登録済み "+h.size}$("status").textContent=value+(h.has(value)?" を手札に登録しました":" を手札から外しました")}catch(e){$("status").textContent="手札の保存に失敗: "+e.message}}
function renderPresets(){const ps=playerData().presets||[];$("count").textContent=ps.length+'機';$("presets").innerHTML=ps.length?ps.map((p,i)=>'<div class="preset"><button type="button" class="load" data-load="'+i+'"><strong>'+esc(p.blade)+'</strong><small>'+esc(p.ratchet)+' · '+esc(p.bit)+'</small></button><button type="button" class="remove" data-remove="'+i+'" aria-label="この完成ベイを削除">削除</button></div>').join(""):'<p class="empty">まだ保存されていません。</p>'}
function render(){renderPlayers();renderPicked();renderParts();renderPresets();renderInventory()}
$("player").addEventListener("change",e=>{const name=e.target.value;e.target.blur();setPlayer(name)});
$("addPlayer").addEventListener("click",()=>{const p=clean($("newPlayer").value);if(!p)return;const d=read();d[p]??={presets:[]};try{write(d);$("newPlayer").value="";setPlayer(p)}catch(e){$("status").textContent="保存に失敗しました: "+e.message}});
$("partPickers").addEventListener("click",e=>{const b=e.target.closest("button[data-part]");if(!b)return;state.selection[b.dataset.part]=b.dataset.value;renderPicked();renderParts()});
$("inventoryToggle").addEventListener("click",()=>{const box=$("inventoryBox");box.hidden=!box.hidden;$("inventoryToggle").setAttribute("aria-expanded",String(!box.hidden));$("inventoryToggle").textContent=box.hidden?"＋ パーツを編集する ▾":"－ パーツの編集を閉じる ▴";renderInventory()});
$("inventoryBox").addEventListener("click",e=>{
 const toggle=e.target.closest("button[data-togglepart]");
 if(toggle){updateHand(toggle.dataset.togglepart,toggle.dataset.value);return}
 const add=e.target.closest("button[data-addpart]");if(!add)return;
 const part=add.dataset.addpart,input=$("inventoryBox").querySelector('input[data-newpart="'+part+'"]'),value=clean(input?.value);if(!value)return;
 const d=read();d.customParts??={};d.customParts[part]??=[];if(!d.customParts[part].includes(value))d.customParts[part].push(value);
 try{write(d);updateHand(part,value,true)}catch(err){$("status").textContent="新規登録に失敗: "+err.message}
});
$("save").addEventListener("click",()=>{if(!state.player||parts.some(p=>!state.selection[p]))return;const d=read();d[state.player]??={presets:[]};const p={...state.selection};d[state.player].presets??=[];if(d[state.player].presets.some(x=>parts.every(k=>x[k]===p[k]))){$("status").textContent="この完成ベイは登録済みです。";return}d[state.player].presets.push(p);try{write(d);renderPresets();$("status").textContent=p.blade+" / "+p.ratchet+" / "+p.bit+" を保存しました"}catch(e){$("status").textContent="保存に失敗しました: "+e.message}});
$("presets").addEventListener("click",e=>{const load=e.target.closest("[data-load]"),remove=e.target.closest("[data-remove]");if(!load&&!remove)return;const d=read(),list=d[state.player]?.presets||[];const i=Number((load||remove).dataset[load?"load":"remove"]);const p=list[i];if(!p)return;if(load){state.selection={blade:p.blade,ratchet:p.ratchet,bit:p.bit};renderPicked();renderParts();$("status").textContent="3パーツを一括で呼び出しました"}else{if(!confirm("この完成ベイを削除しますか？"))return;list.splice(i,1);try{write(d);renderPresets();$("status").textContent="削除しました"}catch(err){$("status").textContent="削除に失敗しました: "+err.message}}});
const list=names();if(list.length)setPlayer(new URLSearchParams(location.search).get("player")&&list.includes(new URLSearchParams(location.search).get("player"))?new URLSearchParams(location.search).get("player"):list[0]);else render();
})();
</script></body></html>
