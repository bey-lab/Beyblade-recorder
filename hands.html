<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEY LAB | プレイヤーの手札</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:radial-gradient(circle at top,#233b5d,#07101e 70%);color:#edf4ff;font:15px/1.5 system-ui,-apple-system,sans-serif;margin:0}.wrap{max-width:1250px;margin:auto;padding:16px}a{color:#c4ddff}h1{margin:15px 0 5px}.hint{color:#a9bfd9;font-size:13px}.panel{background:#15243a;border:1px solid #435a7a;border-radius:14px;padding:16px;margin:14px 0}select,input,button{font:inherit;color:inherit;border:1px solid #607b9c;border-radius:8px;background:#263d5a;padding:10px;min-height:43px}button{cursor:pointer;touch-action:manipulation}button.on{background:#65502c;border-color:#e2bd70;color:#ffe5aa}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.part{border:1px solid #425977;border-radius:11px;padding:12px;background:#1b304b}.part h3{margin:0 0 8px}.pool{max-height:310px;overflow:auto;display:flex;gap:7px;flex-wrap:wrap;align-content:flex-start}.pool button{min-height:37px;padding:7px 9px;font-size:12px}.count{color:#f4d38d;font-weight:800}.actions{margin-top:12px}.actions button{background:#69512b;border-color:#d9b368}input{max-width:100%}.notice{color:#b7f4cf}
</style><link rel="stylesheet" href="./bey-universal.css"></head><body data-bey-mode="hands"><main class="wrap"><header><strong>BEY LAB · PLAYER HANDS</strong><a href="./index.html?home=1">⌂ ホームへ戻る</a></header><h1>🃏 プレイヤーの手札</h1><p class="hint">共通プールから使うパーツを選ぶだけ。手札は試合データと別保存です。手札から外しても過去の記録は消えません。未登録のプレイヤーは全パーツを表示します。</p><section class="panel"><div class="row"><label for="player">プレイヤー</label><select id="player"></select><label for="newPlayer">名前を追加</label><input id="newPlayer" placeholder="プレイヤー名" maxlength="70"><button id="addPlayer">＋ 追加</button></div><p class="hint">プレイヤー名は勝ち抜き・1on1の登録済み名簿からも取得します。追加した名前は手札用に保存されます。</p></section><section class="parts" id="parts"></section><p id="notice" class="notice" aria-live="polite"></p><p class="hint">※ この端末のブラウザ内に保存します。別端末には自動同期されません。</p></main><script src="./bey-hands.js"></script><script>
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={blade:"ブレード",ratchet:"ラチェット",bit:"ビット"};let current="";
function drawPlayers(selected){const names=BEY_HANDS.players();current=selected&&names.includes(selected)?selected:names[0]||"";$("player").innerHTML=names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");$("player").value=current;draw()}
function draw(){const scrolls=[...document.querySelectorAll(".pool")].map(x=>x.scrollTop);if(!current){$("parts").innerHTML="<p>まずプレイヤーを選択してください。</p>";return}
 $("parts").innerHTML=Object.entries(labels).map(([part,label])=>{const all=BEY_HANDS.pool(part),selected=BEY_HANDS.get(current,part);return '<div class="part"><h3>'+label+' <span class="count">'+selected.length+'件</span></h3><p class="hint">タップで手札に追加・解除</p><div class="pool">'+all.map(v=>'<button type="button" data-part="'+part+'" data-value="'+esc(v)+'" class="'+(selected.includes(v)?"on":"")+'">'+esc(v)+'</button>').join("")+'</div><div class="row actions"><input data-new="'+part+'" placeholder="プールにないパーツを追加"><button data-add="'+part+'">＋ 追加</button></div></div>'}).join("");document.querySelectorAll(".pool").forEach((x,i)=>{x.scrollTop=scrolls[i]||0})}
$("player").addEventListener("change",e=>{current=e.target.value;draw()});
$("addPlayer").addEventListener("click",()=>{const name=$("newPlayer").value.trim().slice(0,70);if(!name)return;BEY_HANDS.set(name,"blade",BEY_HANDS.get(name,"blade"));$("newPlayer").value="";drawPlayers(name)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-part],[data-add]");if(!b||!current)return;const part=b.dataset.part||b.dataset.add;const value=b.dataset.part?b.dataset.value:b.parentElement.querySelector("input").value.trim().slice(0,70);if(!value)return;const values=BEY_HANDS.get(current,part);const next=values.includes(value)?values.filter(x=>x!==value):[...values,value];BEY_HANDS.set(current,part,next);draw();$("notice").textContent=current+"の"+labels[part]+"手札を保存しました"});
drawPlayers("");
</script><script src="./bey-universal.js"></script></body></html>
