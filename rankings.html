<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEY LAB 通算ランキング</title><style>body{font-family:system-ui;background:#0c192b;color:#eaf2ff;margin:0}main{max-width:960px;margin:auto;padding:20px}a{color:#9ac9ff}section{background:#152840;border:1px solid #38516e;border-radius:14px;padding:16px;margin:16px 0}select{background:#263e59;color:white;padding:11px;border:1px solid #657f9d;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #344963;padding:9px 5px;text-align:left}th{color:#bed3eb}small{color:#9fbbd7}.scroll{overflow:auto}details{margin-top:20px}summary{cursor:pointer}</style><main><a href="./records.html">← 記録と履歴へ戻る</a><h1>🏆 通算勝率ランキング</h1><p>今日だけでなく、保存されている全日付のフィニッシュ勝率を集計します。TESTはアユミ対アユミの単独実験のみ対象。OFFICIALは全対戦を対象とします。</p><section><label>記録区分 <select id="env"><option value="test">TEST</option><option value="official">OFFICIAL</option></select></label> <label>プレイヤー <select id="player"><option value="">🌐 全員</option></select></label> <label>最低フィニッシュ数 <select id="min"><option value="10">10回以上（推奨）</option><option value="20">20回以上</option><option value="5">5回以上</option><option value="1">1回以上</option></select></label><p id="info"></p></section><section id="out"></section><small>勝率はフィニッシュ数基準。対戦相手・試行条件の差は補正していません。既存データを読み取るだけで変更しません。</small></main><script>
const $=id=>document.getElementById(id),read=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch{return {}}},arr=x=>Array.isArray(x)?x:[],txt=x=>String(x??''),esc=s=>txt(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=p=>JSON.stringify([p.blade||'',p.ratchet||'',p.bit||'']),name=p=>[p.blade,p.ratchet,p.bit].filter(Boolean).join(' / '),valid=p=>p&&p.blade,types={spin:1,over:2,burst:2,extreme:3};
function load(env){const out=[],seen=new Set();function push(id,finish,winner,loser){if(!types[finish]||!valid(winner)||!valid(loser)||seen.has(id))return;seen.add(id);out.push({finish,winner,loser})}
const arena=read('bey-lab-arena-v2-'+env);for(const r of arr(arena.rooms))for(const m of arr(r.results))push('a:'+txt(r.id)+':'+txt(m.id||m.time),m.finish,m.winner,m.loser);
const lab=read('bey-lab-migration-1on1-v1-'+env);const sessions=arr(lab.sessions);function ingest(m){for(const [i,e] of arr(m.events).entries()){if(!['B','X'].includes(e.side))continue;push('l:'+txt(m.id)+':'+txt(e.id||i),e.finish,m.slots?.[e.side],m.slots?.[e.side==='B'?'X':'B'])}}for(const s of sessions)for(const m of arr(s.matches))ingest(m);if(lab.activeMatch)ingest(lab.activeMatch);
const league=read('bey-lab-3on3-v2-'+env);function part(s){let p=txt(s).split(' · ');return p.length===3?{blade:p[0],ratchet:p[1],bit:p[2]}:p.length===2?{blade:p[0],ratchet:'',bit:p[1]}:{blade:p[0]||'',ratchet:'',bit:''}}function fin(s){s=txt(s);return s.includes('エクストリーム')?'extreme':s.includes('バースト')?'burst':s.includes('オーバー')?'over':s.includes('スピン')?'spin':''}function games(m,i){for(const [j,e] of arr(m.events).entries()){let side=Number(e.side),a=e.active?.[side],b=e.active?.[1-side];if(![0,1].includes(side)||!Number.isInteger(a)||!Number.isInteger(b)||!m.slots?.[a]||!m.slots?.[b])continue;push('g:'+i+':'+j,fin(e.finish),{...part(m.slots[a]),player:txt(m.players?.[side])},{...part(m.slots[b]),player:txt(m.players?.[1-side])})}}arr(league.completed).forEach(games);if(league.phase==='battle'&&arr(league.events).length)games(league,'active');return out}
let events=[];function refresh(){const env=$('env').value;events=load(env).filter(e=>env!=='test'||(txt(e.winner.player).trim()==='アユミ'&&txt(e.loser.player).trim()==='アユミ'));const names=[...new Set(events.flatMap(e=>[e.winner.player,e.loser.player]).filter(x=>x&&!/^プレイヤー[１２12]$/.test(x)))].sort((a,b)=>a.localeCompare(b,'ja'));$('player').innerHTML='<option value="">🌐 全員</option>'+names.map(n=>'<option>'+esc(n)+'</option>').join('');render()}
function render(){const map=new Map(),player=$('player').value,min=Number($('min').value);for(const e of events)for(const [type,p] of [['w',e.winner],['l',e.loser]]){if(player&&p.player!==player)continue;const k=key(p);if(!map.has(k))map.set(k,{p,w:0,l:0});map.get(k)[type]++}const rows=[...map.values()].filter(x=>x.w+x.l>=min),best=[...rows].sort((a,b)=>b.w/(b.w+b.l)-a.w/(a.w+a.l)||b.w+b.l-a.w-a.l),worst=[...rows].sort((a,b)=>a.w/(a.w+a.l)-b.w/(b.w+b.l)||b.w+b.l-a.w-a.l);$('info').textContent=(player||'全員')+'・全期間・'+events.length+'フィニッシュ・対象'+rows.length+'カスタム';const table=(title,a)=>'<h2>'+title+'</h2><div class="scroll"><table><thead><tr><th>順位</th><th>カスタム</th><th>勝率</th><th>勝敗</th></tr></thead><tbody>'+a.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(name(x.p))+'</td><td>'+Math.round(x.w/(x.w+x.l)*1000)/10+'%</td><td>'+x.w+'勝'+x.l+'敗</td></tr>').join('')+'</tbody></table></div>';$('out').innerHTML=rows.length?table('👑 勝率上位',best.slice(0,5))+table('🐉 勝率下位',worst.slice(0,5))+'<details><summary>全'+rows.length+'カスタムの順位</summary>'+table('全順位',best)+'</details>':'<p>該当するカスタムがありません。最低フィニッシュ数を下げてください。</p>'}
$('env').onchange=refresh;$('player').onchange=render;$('min').onchange=render;$('env').value=read('bey-lab-environment-v1')==='official'?'official':'test';try{$('env').value=localStorage.getItem('bey-lab-environment-v1')==='official'?'official':'test'}catch{}refresh();
</script></html>
