<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BEY LAB | 統合研究試作機</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#091322;color:#ecf2ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#172b42,#091322 340px);min-height:100vh}main{max-width:980px;margin:auto;padding:25px 15px 80px}a{color:#a9cafa}h1{margin:8px 0}p{color:#b9c9dd}.warn{border:1px solid #967d4c;background:#302a23;border-radius:12px;padding:13px}.controls,.cards{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}label{display:grid;gap:5px;flex:1;min-width:170px;font-size:12px;color:#c8d7ea}select,input,button{font:inherit;color:inherit;background:#1e3046;border:1px solid #51657d;border-radius:9px;padding:12px;width:100%;min-height:46px}button{cursor:pointer}.card{flex:1;min-width:150px;background:#16263a;border:1px solid #344b66;border-radius:14px;padding:15px}.card strong{font-size:26px;display:block;margin:6px 0}.card small{color:#b2c7df}.panel{background:#122035;border:1px solid #334b65;border-radius:15px;padding:17px;margin:15px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #30435b}th{color:#bcd0e4}small,.muted{color:#a8bfd7}#tests{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px} .ok{color:#7eddb6}.bad{color:#ffa4a4} .bar{height:12px;border-radius:15px;overflow:hidden;background:#304458;display:flex}.bar>i{background:#76adf7;display:block}.bar>b{background:#edaa67;display:block}
</style></head><body><main><a href="./records.html">← 現行記録室へ</a><h1>🔬 統合研究試作機 α</h1><p>3モード → 共通フィニッシュ記録 → ブレード・カスタム相性分析</p><div class="warn">⚠ 独立した検証ページ。保存データは読み取りのみ。削除・書き換え・移行は一切行いません。初期状態は架空データです。</div>
<div class="controls"><label>データ<select id="source"><option value="sample">🧪 架空の検証データ</option><option value="test">端末内 TEST（読み取り）</option><option value="official">端末内 OFFICIAL（読み取り）</option></select></label><label>分析日付<input type="date" id="date"></label><label>期間<select id="period"><option value="all">全期間</option><option value="day">指定日だけ</option></select></label><label>モード<select id="mode"><option value="all">全モード</option><option value="arena">勝ち抜き</option><option value="lab">1on1</option><option value="league">3on3</option></select></label></div>
<div class="controls"><label>ブレード<select id="blade"></select></label><label>カスタム<select id="custom"></select></label><label>対戦相手のブレード<select id="opponent"></select></label></div>
<div id="cards" class="cards"></div><section class="panel"><h2>対戦相性・研究結果</h2><div id="report"></div></section><section class="panel"><h2>カスタム別の成績</h2><div id="customs"></div></section><section class="panel"><h2>読取品質・除外理由</h2><div id="quality"></div></section><section class="panel"><h2>自動テスト</h2><div id="tests"></div></section><p class="muted">注：1on1と3on3の「4点先取試合の勝利数」と、ここでいう「フィニッシュ勝率」は異なります。旧形式・判読不能な記録は推測せず除外します。</p></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),types={spin:1,over:2,burst:2,extreme:3},arr=v=>Array.isArray(v)?v:[],txt=v=>String(v??''),esc=v=>txt(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=t=>{const d=new Date(t);if(!Number.isFinite(d.getTime()))return '';return [d.getFullYear(),('0'+(d.getMonth()+1)).slice(-2),('0'+d.getDate()).slice(-2)].join('-')},build=p=>[p.blade,p.ratchet||'?',p.bit||'?'].join(' / '),key=p=>JSON.stringify([p.blade,p.ratchet,p.bit]),clone=p=>({blade:txt(p?.blade).trim(),ratchet:txt(p?.ratchet).trim(),bit:txt(p?.bit).trim()}),valid=p=>!!p?.blade;
const sample=()=>{const events=[];let i=0;const a={blade:'バハムートブリッツ',ratchet:'5-70',bit:'R'},b={blade:'シルバーウルフ',ratchet:'9-70',bit:'FB'},c={...a,bit:'B'};function add(w,l,f,d,mode){events.push({id:'sample:'+i++,mode,date:d,finish:f,points:types[f],winner:w,loser:l})}for(let j=0;j<7;j++)add(b,a,'spin','2026-10-21','arena');for(let j=0;j<3;j++)add(a,b,'extreme','2026-10-21','arena');for(let j=0;j<6;j++)add(c,b,j%2?'over':'spin','2026-11-21','lab');for(let j=0;j<4;j++)add(b,c,'spin','2026-11-21','lab');return events};
function load(env){const qa=[],out=[],seen=new Set();function push(e){if(!e||!types[e.finish]||!e.date||!valid(e.winner)||!valid(e.loser)){qa.push('不完全な対戦記録を除外');return}if(seen.has(e.id)){qa.push('重複IDを除外: '+e.id);return}seen.add(e.id);out.push(e)}
function read(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch{return {}}}
const arena=read('bey-lab-arena-v2-'+env);for(const r of arr(arena.rooms))for(const m of arr(r?.results)){if(!m?.winner||!m?.loser)continue;push({id:'arena:'+txt(r.id)+':'+txt(m.id||m.time),mode:'arena',date:date(m.time)||r.date,finish:m.finish,points:types[m.finish],winner:clone(m.winner),loser:clone(m.loser)})}
const lab=read('bey-lab-migration-1on1-v1-'+env);const ls=arr(lab.sessions);for(const sess of ls){for(const m of arr(sess.matches))ingestLab(m,sess);for(const old of arr(sess.records))qa.push('旧1on1記録を対象外（互換解析未実装）')}if(lab.activeMatch){const sess=ls.find(s=>s.id===lab.activeId)||{};ingestLab(lab.activeMatch,sess)}
function ingestLab(m,sess){for(const [index,e] of arr(m?.events).entries()){const side=e?.side;if(side!=='B'&&side!=='X')continue;const other=side==='B'?'X':'B';push({id:'lab:'+txt(m.id)+':'+txt(e.id||index),mode:'lab',date:date(e.time)||sess.date,finish:e.finish,points:types[e.finish],winner:clone(m.slots?.[side]),loser:clone(m.slots?.[other])})}}
const league=read('bey-lab-3on3-v2-'+env);function part(s){const p=txt(s).split(' · ').filter(Boolean);if(p.length===3)return {blade:p[0],ratchet:p[1],bit:p[2]};if(p.length===2)return {blade:p[0],ratchet:'',bit:p[1]};return {blade:p[0]||'',ratchet:'',bit:''}}
function fin(v){const f=txt(v);return f.includes('エクストリーム')?'extreme':f.includes('バースト')?'burst':f.includes('オーバー')?'over':f.includes('スピン')?'spin':null}
function ingestLeague(m,index){for(const [j,e] of arr(m.events).entries()){const side=Number(e?.side);if(side!==0&&side!==1)continue;const a=e?.active?.[side],b=e?.active?.[1-side];if(!Number.isInteger(a)||!Number.isInteger(b)||!m.slots?.[a]||!m.slots?.[b]){qa.push('3on3 機体位置不明を除外');continue}const finish=fin(e.finish);push({id:'league:'+index+':'+j,mode:'league',date:date(e.time)||date(m.ended),finish,points:types[finish],winner:part(m.slots[a]),loser:part(m.slots[b])})}}
arr(league.completed).forEach(ingestLeague);if(league.phase==='battle'&&arr(league.events).length)ingestLeague(league,'active');
return {events:out,qa}}
const state={events:sample(),qa:[]};function options(id,values,all){let sel=$(id),prev=sel.value;sel.innerHTML='<option value="">'+all+'</option>'+values.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');if(values.includes(prev))sel.value=prev;else if(id==='blade'&&values.length)sel.value=values[0]}
function refreshOptions(){const bs=[...new Set(state.events.flatMap(e=>[e.winner.blade,e.loser.blade]))].sort((a,b)=>a.localeCompare(b,'ja'));options('blade',bs,'全ブレード');options('opponent',bs,'対戦相手を指定しない');const cs=[...new Set(state.events.flatMap(e=>[e.winner,e.loser]).filter(x=>!$('blade').value||x.blade===$('blade').value).map(key))];const old=$('custom').value;$('custom').innerHTML='<option value="">全カスタム</option>'+cs.map(k=>'<option value="'+esc(k)+'">'+esc(build(JSON.parse(k)))+'</option>').join('');if(cs.includes(old))$('custom').value=old}
function summarize(events,focus){let wins=0,loss=0,pts=0,against=0,fin={spin:0,over:0,burst:0,extreme:0};for(const e of events){const w=focus(e.winner),l=focus(e.loser);if(w&&!l){wins++;pts+=e.points;fin[e.finish]++}else if(l&&!w){loss++;against+=e.points}}return {wins,loss,pts,against,fin,total:wins+loss,rate:wins+loss?wins/(wins+loss):null}}
const pct=n=>n==null?'—':Math.round(n*1000)/10+'%',card=(t,v,sub)=>'<div class="card"><small>'+t+'</small><strong>'+v+'</strong><small>'+sub+'</small></div>';
function render(){const subset=state.events.filter(e=>($('mode').value==='all'||e.mode===$('mode').value)&&($('period').value==='all'||e.date===$('date').value));const target=$('blade').value,custom=$('custom').value,opponent=$('opponent').value;const relevant=subset.filter(e=>(!target||e.winner.blade===target||e.loser.blade===target)&&(!opponent||e.winner.blade===opponent||e.loser.blade===opponent));const focused=relevant.filter(e=>{const w=(!target||e.winner.blade===target)&&(!custom||key(e.winner)===custom),l=(!target||e.loser.blade===target)&&(!custom||key(e.loser)===custom);return (w&&(!opponent||e.loser.blade===opponent))||(l&&(!opponent||e.winner.blade===opponent))});const predicate=p=>(!target||p.blade===target)&&(!custom||key(p)===custom);const s=summarize(focused,predicate);
$('cards').innerHTML=card('フィニッシュ数',s.total, s.wins+'勝 '+s.loss+'敗')+card('フィニッシュ勝率',pct(s.rate),'勝利回数 ÷ 総回数')+card('獲得点 / 失点',s.pts+' / '+s.against,'得失点差 '+(s.pts-s.against))+card('平均獲得点',s.total?(s.pts/s.total).toFixed(2):'—','全フィニッシュあたり');
let detail=Object.entries(s.fin).map(([k,v])=>k+': '+v+'回').join(' / ');$('report').innerHTML='<p>'+esc(target||'全ブレード')+'：'+s.total+'フィニッシュ、'+s.wins+'勝'+s.loss+'敗、勝率'+pct(s.rate)+'。獲得'+s.pts+'点、失点'+s.against+'点。</p><p>'+esc(detail)+'</p>'+(s.total<10?'<p class="muted">件数が少ないため傾向は参考値です。</p>':'')+(s.total===0?'<p class="muted">対象の記録がありません。</p>':'');
const builds=new Map();for(const e of relevant){for(const p of [e.winner,e.loser])if((!target||p.blade===target)&&!builds.has(key(p)))builds.set(key(p),p)}
const rows=[...builds.values()].map(p=>{const f=relevant.filter(e=>(key(e.winner)===key(p)&&(!opponent||e.loser.blade===opponent))||(key(e.loser)===key(p)&&(!opponent||e.winner.blade===opponent)));return {p,s:summarize(f,x=>key(x)===key(p))}}).filter(x=>x.s.total).sort((a,b)=>(b.s.rate??0)-(a.s.rate??0)||b.s.total-a.s.total);$('customs').innerHTML=rows.length?'<table><thead><tr><th>カスタム</th><th>勝率</th><th>勝敗</th><th>得点差</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(build(x.p))+'</td><td>'+pct(x.s.rate)+'</td><td>'+x.s.wins+'-'+x.s.loss+'</td><td>'+(x.s.pts-x.s.against)+'</td></tr>').join('')+'</tbody></table>':'<p>対象なし</p>';
$('quality').innerHTML='<p>読み込んだ有効フィニッシュ：'+state.events.length+'件 ／ 除外・注意：'+state.qa.length+'件</p>'+state.qa.slice(0,15).map(x=>'<small>'+esc(x)+'</small>').join('<br>');}
function tests(){const a=sample(),first=a.filter(x=>x.date==='2026-10-21'),p=x=>x.blade==='バハムートブリッツ',s=summarize(first,p),checks=[['10件を読める',first.length===10],['3勝7敗',s.wins===3&&s.loss===7],['勝率30%',s.rate===.3],['得点9対7',s.pts===9&&s.against===7],['別カスタムを分離',new Set(a.filter(x=>x.winner.blade==='バハムートブリッツ').map(x=>x.winner.bit)).size===2]];$('tests').innerHTML=checks.map(([n,ok])=>'<div class="'+(ok?'ok':'bad')+'">'+(ok?'PASS':'FAIL')+' '+n+'</div>').join('')}
$('source').addEventListener('change',()=>{const val=$('source').value;const r=val==='sample'?{events:sample(),qa:[]}:load(val);state.events=r.events;state.qa=r.qa;refreshOptions();render()});$('blade').addEventListener('change',()=>{refreshOptions();render()});for(const id of ['date','period','mode','custom','opponent'])$(id).addEventListener('change',render);$('date').value=date(new Date());refreshOptions();tests();render();
})();
</script></body></html>
