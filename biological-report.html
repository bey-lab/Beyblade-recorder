<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171c16"><title>BEY LAB | 戦闘傾向分析</title><link rel="stylesheet" href="./bey-universal.css"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#303b2a,#11170f 65%);color:#e4e8d7;font:15px/1.6 system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:1050px;margin:auto;padding:22px 16px 55px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #657057;padding-bottom:14px}a{color:#c9d5b7}.kicker{font-size:11px;letter-spacing:.18em;color:#aab79c}h1{font-size:clamp(25px,5vw,38px);margin:14px 0 3px}.sub{color:#b1bea7;font-size:13px}.report{margin-top:20px;background:linear-gradient(135deg,#202719,#151b14);border:1px solid #67745a;padding:clamp(15px,3vw,28px);box-shadow:0 15px 40px #0006}.report-title{border-bottom:1px solid #56624b;padding-bottom:9px;font-size:18px;font-weight:900;letter-spacing:.12em}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}.metrics{display:grid;align-content:start}.metric{display:flex;justify-content:space-between;gap:12px;padding:10px 3px;border-bottom:1px solid #414b3b}.metric span{color:#bac5ae}.metric strong{font-variant-numeric:tabular-nums}.result{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:320px}.silhouette{font-size:clamp(80px,16vw,155px);line-height:1.3;filter:grayscale(1) brightness(1.8);opacity:.9}.your{color:#a8b39d;font-size:12px;letter-spacing:.13em}.animal{font-size:clamp(26px,4vw,40px);font-weight:950;line-height:1.3}.comment{border-top:1px solid #56624b;margin-top:17px;padding-top:16px;min-height:70px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}button,select{font:inherit;color:#f0f4e6;background:#34442c;border:1px solid #87967a;border-radius:9px;padding:11px 15px;min-height:45px}button{font-weight:900;cursor:pointer}button:disabled{opacity:.4;cursor:default}.note{font-size:12px;color:#a5b29b;margin-top:14px}@media(max-width:680px){.report-grid{grid-template-columns:1fr}.result{min-height:220px}.silhouette{font-size:95px}.metric{padding:8px 3px}}</style></head><body data-bey-mode="extra"><main><header><strong>BEY LAB · EXTRA RESEARCH</strong><a href="./index.html?home=1">⌂ ホームへ</a></header><div class="kicker" style="margin-top:24px">BIOLOGICAL COMBAT CLASSIFICATION</div><h1>戦闘傾向分析</h1><div class="sub">記録に基づき、本日の参加者たちの生物学的戦闘傾向を判定します。</div><div class="controls"><label for="date">測定日</label><input type="date" id="date" style="font:inherit;background:#293625;color:#fff;border:1px solid #819074;border-radius:8px;padding:10px;min-height:45px"><button id="analyze">解析を実行</button></div><section class="report" aria-live="polite"><div class="report-title">RESULT <span id="environment" style="float:right;font-size:11px;color:#aab79c"></span></div><div class="report-grid"><div class="metrics" id="metrics"></div><div class="result"><div id="silhouette" class="silhouette" aria-hidden="true">◌</div><div class="your">YOUR TITLE IS...</div><div class="animal" id="animal">未測定</div><div class="kicker" id="number">CLASSIFICATION PENDING</div></div></div><div class="comment" id="comment">測定日を選び、解析を実行してください。</div></section><div class="note">試作版・12分類。3on3は試合中のフィニッシュも含み、勝利確定後に二重計上しません。1on1・勝ち抜き・3on3のフィニッシュ記録を合算します。対戦記録の変更・保存は一切行いません。端末・保存環境が異なる記録は読み取れません。</div></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id), today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
$('date').value=today();
const species=[
['オオサンショウウオ','🦎','本日の傾向は、オオサンショウウオと高い類似性を示しました。'],
['コーカサスオオカブト','🪲','エクストリームフィニッシュが多い傾向です。角は3本あります。'],
['ハシビロコウ','🐦','安定した観測結果です。特に感想はありません。'],
['モンハナシャコ','🦐','衝撃を伴う決着が確認されました。概ね良好です。'],
['マンボウ','🐟','本日の観測は終了しました。海は広いです。'],
['センザンコウ','🦔','防御的な特性が認められます。丸くなる必要はありません。'],
['ダイオウグソクムシ','🦀','省エネルギー型の挙動が認められました。'],
['カモノハシ','🦆','複数の特徴が確認されました。分類は完了しています。'],
['タスマニアデビル','🐾','活動性の高い記録です。落ち着いてください。'],
['メンダコ','🐙','深海型の傾向が認められました。詳細は不明です。'],
['ラーテル','🦡','継続性が観測されました。まだ続けるのでしょうか。'],
['アメフラシ','🐌','極めて良好な傾向です。理由の説明は省略します。']
];
function read(){let env='test';try{if(localStorage.getItem('bey-lab-environment-v1')==='official')env='official'}catch(e){}
$('environment').textContent=env==='official'?'OFFICIAL':'TEST';
try{const s=JSON.parse(localStorage.getItem('bey-lab-migration-1on1-v1-'+env));return s&&Array.isArray(s.sessions)?s:null}catch(e){return null}}
function gather(s,date){const out=[];if(!s)return out;const add=(e)=>{if(e&&typeof e.time==='string'&&e.time.slice(0,10)===date&&['spin','over','burst','extreme'].includes(e.finish))out.push(e)};
for(const session of s.sessions){for(const m of (session.matches||[]))for(const e of (m.events||[]))add(e);for(const e of (session.records||[]))add(e)}
if(s.activeMatch&&s.activeId&&s.sessions.some(v=>v.id===s.activeId))for(const e of (s.activeMatch.events||[]))add(e);
return out}
function gatherArena(date){const out=[];let env='test';try{env=localStorage.getItem('bey-lab-environment-v1')==='official'?'official':'test';const s=JSON.parse(localStorage.getItem('bey-lab-arena-v2-'+env));if(!s||!Array.isArray(s.rooms))return out;const seen=new Set();for(const room of s.rooms){for(const e of (room.results||[])){if(!e||!['spin','over','burst','extreme'].includes(e.finish))continue;const d=typeof e.time==='string'?new Date(e.time):null;if(!d||Number.isNaN(d.getTime()))continue;const localDate=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(localDate!==date)continue;const key=e.id||e.time+'|'+e.finish+'|'+(e.winner?.player||'');if(seen.has(key))continue;seen.add(key);out.push(e)}}}catch(e){return out}return out}
function gatherLeague(date){const out=[];let env='test';try{env=localStorage.getItem('bey-lab-environment-v1')==='official'?'official':'test';const s=JSON.parse(localStorage.getItem('bey-lab-3on3-v2-'+env));if(!s)return out;const add=e=>{if(!e||typeof e.time!=='string')return;const t=String(e.finish||'');const finish=t.includes('エクストリーム')?'extreme':t.includes('バースト')?'burst':t.includes('オーバー')?'over':t.includes('スピン')?'spin':null;if(!finish)return;const d=new Date(e.time);if(Number.isNaN(d.getTime()))return;const day=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(day===date)out.push({finish})};for(const m of (s.completed||[]))for(const e of (m.events||[]))add(e);if(s.phase==='battle')for(const e of (s.events||[]))add(e)}catch(e){}return out}
function render(){const date=$('date').value;if(!date)return;const solo=gather(read(),date),arena=gatherArena(date),league=gatherLeague(date),events=[...solo,...arena,...league],counts={spin:0,over:0,burst:0,extreme:0};for(const e of events)counts[e.finish]++;
const entries=[['測定日',date],['記録フィニッシュ数',events.length+' TIMES'],['1on1 / 勝ち抜き / 3on3',solo.length+' / '+arena.length+' / '+league.length+' TIMES'],['スピン',counts.spin+' TIMES'],['オーバー',counts.over+' TIMES'],['バースト',counts.burst+' TIMES'],['エクストリーム',counts.extreme+' TIMES']];
$('metrics').replaceChildren();for(const [k,v] of entries){const row=document.createElement('div');row.className='metric';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=k;b.textContent=v;row.append(a,b);$('metrics').append(row)}
if(!events.length){$('silhouette').textContent='◌';$('animal').textContent='判定不能';$('number').textContent='INSUFFICIENT DATA';$('comment').textContent='対象日の1on1・勝ち抜き・3on3フィニッシュ記録が確認できませんでした。';return}
let h=2166136261;for(const ch of date)h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;for(const e of events){const n=['spin','over','burst','extreme'].indexOf(e.finish)+1;h=Math.imul(h^n,16777619)>>>0}
const index=(h+counts.extreme*7+counts.burst*11+counts.spin*3+events.length*13)%species.length,sp=species[index];$('silhouette').textContent=sp[1];$('animal').textContent=sp[0];$('number').textContent='CLASSIFICATION '+String(index+1).padStart(3,'0');$('comment').textContent=sp[2]}
$('analyze').addEventListener('click',render);
})();
</script><script src="./bey-universal.js"></script></body></html>
