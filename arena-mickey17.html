<style>

strong{color:var(--gold)}.overlay{position:fixed;inset:0;background:#060b14e8;display:flex;align-items:center;justify-content:center;z-index:30;padding:15px}.overlay[hidden]{display:none}.victory{width:min(580px,100%);background:radial-gradient(circle at 50% 0%,#763e39,#1b2336 65%);border:2px solid #edac77;border-radius:21px;padding:24px 17px;text-align:center;box-shadow:0 0 50px #db755c45}.victory .winname{font-size:clamp(28px,7vw,52px);font-weight:1000;overflow-wrap:anywhere}.victory .big{font-size:clamp(68px,15vw,126px);line-height:1.05;color:var(--gold);font-weight:1000}.victory .quote{margin:16px 0;color:#d9dfeb;min-height:27px}.next{display:block;width:100%;min-height:72px;font-size:23px;background:linear-gradient(110deg,#9b3745,#d46666);border:1px solid #f9b6a5;border-radius:13px;font-weight:1000}.notice{min-height:22px;color:var(--gold);font-size:12px;margin:8px 0}.mini{font-size:12px}.preset{margin-top:8px}@media(max-width:650px){.versus{grid-template-columns:1fr 1fr;gap:7px}.fighter{padding:9px}.pick{font-size:11px;padding:8px}.finishgrid{grid-template-columns:1fr 1fr;gap:7px}.pads{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.finish{min-height:70px;font-size:12px}.below{grid-template-columns:1fr}.streak{padding:9px}.room{padding:10px}}@media(min-width:900px){.finishgrid{grid-template-columns:1fr 1fr}.finish{min-height:85px}}[hidden]{display:none!important}
</style></head><body><div class="wrap">
<header><div><div class="tag">BEY LAB · EXPERIMENT 17</div><strong>🟥 勝ち抜き</strong><div class="muted mini">ミッキー17 · 独立テスト版 / 既存モード非改変</div></div><a class="button" href="./index.html">⌂ ホーム</a></header>
<div class="toolbar"><span class="tag">ONE FINISH · ONE WIN</span><div><button class="button" id="undo">↶ 直前の勝敗を取消</button> <button class="button" id="newRoom">＋ 新しい大会</button></div></div>
<section class="room"><div class="between"><div><div class="tag">TOURNAMENT</div><h1 id="roomTitle">大会</h1><div class="muted mini" id="roomSub"></div></div><label>大会を選ぶ <select id="roomSelect"></select></label></div></section>
<div class="streakboard" id="streakboard"></div><div class="versus"><section class="fighter" id="fighterB"></section><section class="fighter x" id="fighterX"></section></div>
<section class="room" id="diagnostics" style="border-color:#c9a36e"><div class="between"><strong>🔬 操作診断 v1</strong><span class="tag" id="diagVersion">DIAG-01</span></div><div class="mini muted">ブレードを1回押すと、タップ検知・データ更新・保存・画面更新の順に表示します。</div><pre id="diagLog" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;margin:8px 0 0;color:#ffe0a3">診断準備中</pre></section>
<section class="battle"><div class="between"><h2>⚔️ フィニッシュを記録</h2><span class="tag">勝者側をタップ</span></div><div class="finishgrid" id="finishgrid"></div><p class="notice" id="notice"></p></section>
<div class="below"><section class="card"><h2>🏆 大会成績</h2><div id="stats"></div></section><section class="card"><h2>📋 大会履歴</h2><div id="history"></div></section></div>
</div><div class="overlay" id="overlay" hidden><div class="victory"><div class="tag">VICTORY · BEY LAB</div><div class="winname" id="winName"></div><div id="winFinish" style="font-size:clamp(23px,5vw,38px);font-weight:1000;color:#ff9f90;margin:13px 0 7px;letter-spacing:.03em"></div><div class="big" id="winStreak"></div><div id="winBlade"></div><div class="quote" id="winQuote"></div><button class="next" id="next">次のバトルへ ›</button><button class="button" id="winUndo" style="margin-top:12px">↶ この勝敗を取り消す</button></div></div>
<script src="./bey-hands.js?v=mickey17-20261017-02"></script><script>
(function(){"use strict";
const H=window.BEY_HANDS,ENV=localStorage.getItem("bey-lab-migration-environment-v1"),env=ENV==="official"?"official":"test",KEY="bey-lab-mickey17-arena-v1-"+env;
const $=id=>document.getElementById(id),date=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")},id=()=>crypto?.randomUUID?.()||Date.now()+"-"+Math.random().toString(36).slice(2),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),copy=o=>JSON.parse(JSON.stringify(o));
const diagLines=[];function diag(t){diagLines.unshift(new Date().toLocaleTimeString("ja-JP")+" "+t);diagLines.length=Math.min(diagLines.length,7);const el=document.getElementById("diagLog");if(el)el.textContent=diagLines.join("\\n")}window.addEventListener("error",e=>diag("ERROR: "+e.message));window.addEventListener("unhandledrejection",e=>diag("PROMISE ERROR: "+String(e.reason)));document.addEventListener("click",e=>{const b=e.target.closest?.("button");if(b?.dataset.kind)diag("① TAP "+b.dataset.side+" "+b.dataset.kind+" "+b.dataset.value)},true);
const finishes=[["spin","スピン","◉"],["over","オーバー","↗"],["burst","バースト","✦"],["extreme","エクストリーム","⚡"]];
const legacyBlades=()=>{const found=[];for(const e of ["test","official"]){for(const k of ["bey-lab-migration-1on1-v1-","bey-lab-migration-arena-v1-","bey-lab-arena-v1-"]){try{const d=JSON.parse(localStorage.getItem(k+e));for(const b of d?.blades||[])if(typeof b==="string"&&b.trim())found.push(b.trim())}catch(_){}}}return found};const roster=()=>H?.players()||[],blades=p=>[...new Set([...(H?.get(p,"blade")||[]),...(H?.pool("blade")||[]),...legacyBlades()])],parts=(p,k)=>[...new Set([...(H?.get(p,k)||[]),...(H?.pool(k)||[])])],baseSlot=p=>({player:p||"",blade:blades(p)[0]||"",ratchet:"",bit:""});
function init(){const p=roster();return {version:1,rooms:[],activeRoomId:null,slots:{B:baseSlot(p[0]),X:baseSlot(p[1]||p[0])},lastBuild:{}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||state.version!==1||!Array.isArray(state.rooms)||!state.slots)state=init();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){$("notice").textContent="⚠ 保存できません。端末の空き容量を確認してください";return false}}
function room(){return state.rooms.find(r=>r.id===state.activeRoomId)}
function newRoom(){const r={id:id(),date:date(),created:new Date().toISOString(),results:[]};state.rooms.push(r);state.activeRoomId=r.id;return r}
function ensureRoom(){const r=room();if(!r){newRoom();save();return}if(r.date!==date()&&!r.manualResume){const same=state.rooms.find(x=>x.date===date()&&!x.manualResume);if(same)state.activeRoomId=same.id;else newRoom();save()}}
ensureRoom();
// Repair empty selections left by the first prototype; never touch shared 1on1 data.
for(const side of ["B","X"]){const slot=state.slots[side];if(slot?.player&&!slot.blade){slot.blade=blades(slot.player)[0]||""}}save();
function allPlayers(){return [...new Set([...roster(),...Object.values(state.slots).map(x=>x.player).filter(Boolean)])]}
function slotSnapshot(s){return copy(state.slots[s])}
function currentResults(){return room()?.results||[]}
function streak(player,blade){let p=0,b=0,started=false;for(const r of currentResults().slice().reverse()){if(r.winner.player!==player){if(started)break;continue}if(!started)started=true;p++;if(b===p-1&&r.winner.blade===blade)b++}return {player:p,blade:b}}
function build(s){const v=state.slots[s];return [v.blade,v.ratchet,v.bit].filter(Boolean).join(" / ")||"ブレード未選択"}
const expanded={B:false,X:false};
function renderSide(s){const v=state.slots[s],players=allPlayers(),list=[...new Set([...blades(v.player),v.blade].filter(Boolean))],r=streak(v.player,v.blade);
const btn=(kind,name,active)=>'<button class="pick '+(active?"active":"")+'" data-kind="'+kind+'" data-side="'+s+'" data-value="'+esc(name)+'">'+esc(name)+'</button>';
const select=k=>{let a=parts(v.player,k);if(v[k]&&!a.includes(v[k]))a=[v[k],...a];return '<div class="caption">'+(k==="ratchet"?"ラチェット":"ビット")+' · 任意</div><select class="part" data-part="'+k+'" data-side="'+s+'"><option value="">未選択</option>'+a.map(x=>'<option value="'+esc(x)+'" '+(x===v[k]?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select>'};
const summary='<div class="build" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div><small style="display:block">現在のカスタム</small>'+esc(build(s))+'</div><button class="button" data-toggle="'+s+'">'+(expanded[s]?"▲ 閉じる":"▦ 機体を変更")+'</button></div>';
const details=expanded[s]?'<div class="caption">ブレード</div><div class="picks">'+list.map(b=>btn("blade",b,b===v.blade)).join("")+'</div>'+select("ratchet")+select("bit")+'<div class="toolbar"><button class="button preset" data-preset="'+s+'">⚡ 一式呼出</button><button class="button preset" data-savepreset="'+s+'">＋ 一式保存</button></div>':"";
$("fighter"+s).innerHTML='<div class="side">'+s+'-SIDE</div><div class="caption">プレイヤー</div><div class="picks">'+players.map(p=>btn("player",p,p===v.player)).join("")+'</div><div class="caption"><a href="./hands.html?player='+encodeURIComponent(v.player)+'">🃏 手札管理</a></div>'+summary+details;
return '<div class="streak '+(s==="X"?"x":"")+'"><div class="who">'+esc(v.player||"未選択")+'</div><div class="num">'+r.player+'<span style="font-size:.25em"> 連勝</span></div><div class="sub">'+esc(v.blade||"—")+' · '+r.blade+'連勝</div></div>'}
function render(){const r=room();$("roomTitle").textContent=r?.date+" の大会";$("roomSub").textContent=(r?.results.length||0)+" 戦 · "+(r?.manualResume?"過去大会を再開中":"日付別の自動大会");$("roomSelect").innerHTML=state.rooms.slice().reverse().map(x=>'<option value="'+x.id+'" '+(x.id===state.activeRoomId?"selected":"")+'>'+x.date+' ('+x.results.length+'戦)'+(x.manualResume?" ↩":"")+'</option>').join("");$("streakboard").innerHTML=renderSide("B")+renderSide("X");$("finishgrid").innerHTML=["B","X"].map(s=>'<div class="finishgroup '+(s==="X"?"x":"")+'"><h3>'+s+'-SIDE · '+esc(state.slots[s].player)+'</h3><div class="pads">'+finishes.map(f=>'<button class="finish" data-finish="'+f[0]+'" data-side="'+s+'" '+(!state.slots.B.player||!state.slots.X.player?"disabled":"")+'>'+f[2]+' '+f[1]+'<small>勝利を記録</small></button>').join("")+'</div></div>').join("");
const res=currentResults(),count={};for(const x of res){for(const p of [x.winner.player,x.loser.player])count[p]??={w:0,l:0,max:0};count[x.winner.player].w++;count[x.loser.player].l++}
$("stats").innerHTML=Object.entries(count).sort((a,b)=>b[1].w-a[1].w).map(([p,v])=>'<div class="entry"><strong>'+esc(p)+'</strong>　'+v.w+'勝 '+v.l+'敗 · 勝率 '+Math.round(100*v.w/(v.w+v.l))+'%</div>').join("")||'<div class="muted">まだ対戦記録がありません。</div>';
$("history").innerHTML=res.slice().reverse().slice(0,70).map((x,i)=>'<div class="entry"><strong>#'+(res.length-i)+' '+esc(x.winner.player)+'</strong>　'+esc(finishes.find(f=>f[0]===x.finish)?.[1]||"")+'勝利<br><span class="muted">'+esc(x.winner.blade)+' vs '+esc(x.loser.blade)+' · '+new Date(x.time).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+'</span></div>').join("")||'<div class="muted">まだ記録がありません。</div>'}
function notice(t){$("notice").textContent=t}
function validate(){for(const s of ["B","X"]){const v=state.slots[s];if(!v.player){notice("プレイヤーを選択してください");return false}if(H?.ratchetStatus?.(v.blade,v.ratchet,v.bit)==="conflict"){notice("一体型ラチェットの構成が競合しています");return false}if(H?.integrated?.("blade",v.blade)&&v.ratchet){notice("ラチェット一体型ブレードでは別ラチェットを選べません");return false}if(H?.integrated?.("bit",v.bit)&&v.ratchet){notice("ラチェット一体型ビットでは別ラチェットを選べません");return false}}return true}
function win(side,finish){if(!$("overlay").hidden)return;if(!validate())return;const r=room(),winner=slotSnapshot(side),loser=slotSnapshot(side==="B"?"X":"B");const entry={id:id(),time:new Date().toISOString(),side,finish,winner,loser};r.results.push(entry);if(!save()){r.results.pop();return}showWin(entry);render()}
function showWin(entry){const v=streak(entry.winner.player,entry.winner.blade);$("winName").textContent=entry.winner.player+" 勝利！";$("winFinish").textContent=({spin:"◉ スピンフィニッシュ！",over:"↗ オーバーフィニッシュ！",burst:"✦ バーストフィニッシュ！",extreme:"⚡ エクストリームフィニッシュ！"})[entry.finish]||"フィニッシュ！";$("winStreak").textContent=v.player+"連勝";$("winBlade").textContent=entry.winner.blade+" · "+v.blade+"連勝";$("winQuote").textContent="勝敗記録を確認しました。";$("overlay").hidden=false}
function undo(){const r=room();if(!r?.results.length){notice("取り消せる勝敗がありません");return}const e=r.results.pop();if(!save()){r.results.push(e);return}$("overlay").hidden=true;render();notice("↶ 直前の勝敗を取り消しました")}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const s=b.dataset.side;
if(b.dataset.toggle){expanded[b.dataset.toggle]=!expanded[b.dataset.toggle];render();return}
if(b.dataset.kind){const v=state.slots[s],value=b.dataset.value;if(b.dataset.kind==="player"){state.lastBuild[v.player]=copy(v);const remembered=state.lastBuild[value];state.slots[s]=remembered?copy(remembered):baseSlot(value)}else{v.blade=value;if(H?.integrated?.("blade",value))v.ratchet=""}diag("② STATE "+s+" blade="+state.slots[s].blade);const saved=save();diag("③ SAVE "+(saved?"OK":"FAILED"));render();diag("④ RENDER "+state.slots[s].blade)}
else if(b.dataset.finish)win(s,b.dataset.finish);
else if(b.dataset.preset){const side=b.dataset.preset,v=state.slots[side],presets=H?.presetsGet(v.player)||[];if(!presets.length){notice("保存済みカスタムがありません");return}const msg=presets.map((x,i)=>(i+1)+". "+[x.blade,x.ratchet,x.bit].filter(Boolean).join(" / ")).join("\n");const n=Number(prompt("呼び出すカスタム番号を入力\n"+msg));if(!Number.isInteger(n)||n<1||n>presets.length)return;Object.assign(v,presets[n-1]);save();render()}
else if(b.dataset.savepreset){const v=state.slots[b.dataset.savepreset];if(H?.presetsSave(v.player,v))notice("カスタムを共通手札に保存しました")}
});
document.addEventListener("change",e=>{if(!e.target.matches("select[data-part]"))return;const v=state.slots[e.target.dataset.side],part=e.target.dataset.part;v[part]=e.target.value;if(part==="bit"&&H?.integrated?.("bit",v.bit))v.ratchet="";save();render()});
$("roomSelect").addEventListener("change",e=>{state.activeRoomId=e.target.value;room().manualResume=room().date!==date();save();render()});
$("newRoom").addEventListener("click",()=>{if(!confirm("新しい大会を作成しますか？ 以前の大会は残ります。"))return;newRoom();save();render()});
$("undo").addEventListener("click",undo);$("winUndo").addEventListener("click",undo);$("next").addEventListener("click",()=>{$("overlay").hidden=true;notice("次のバトルへ！")});
window.addEventListener("bey-hands-updated",render);render();diag("READY / "+env+" / players="+roster().length+" / blades="+blades(state.slots.B.player).length+" / integrated="+typeof H?.integrated);if(!blades(state.slots.B.player).length||!blades(state.slots.X.player).length)notice("診断: ブレード一覧が空です。1on1の登録内容と手札を確認してください。");
})();
</script></body></html>
