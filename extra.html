<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>BEY LAB | お題箱</title><link rel="stylesheet" href="./bey-universal.css"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c2b46,#080e19 72%);color:#f1f5ff;font:15px/1.55 system-ui,-apple-system,sans-serif}main{max-width:1050px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #425570;padding-bottom:14px}a{color:#c9ddff}h1{font-size:clamp(26px,4vw,36px);margin:8px 0}.sub{color:#b4c4da;font-size:13px}.badge{font-size:11px;border:1px solid #64738c;border-radius:40px;padding:4px 11px;color:#f7d99c}.panel{border:1px solid #3f5069;border-radius:18px;background:#111c2e;padding:18px;margin-top:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.side{border-radius:18px;padding:20px;min-height:275px;display:flex;flex-direction:column;gap:14px}.side.x{background:#0b213b;border:1px solid #426eab}.side.b{background:#261c16;border:1px solid #846547}.side h2{margin:0;font-size:20px}.side.x h2{color:#91c3ff}.side.b h2{color:#f3d4a0}.kind{font-size:12px;color:#c2c5ce}.prompt{font-size:clamp(19px,2.5vw,27px);font-weight:900;line-height:1.5;flex:1;overflow-wrap:anywhere}.row{display:flex;gap:8px;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #637b9d;border-radius:11px;padding:10px;color:#fff;background:#243550;min-height:44px}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff}button.primary{background:#e5bc71;border-color:#ffe1a7;color:#1b2533;font-weight:900}button.full{width:100%;font-weight:900}button.small{font-size:12px;padding:7px 10px;min-height:36px}select{max-width:100%}input,textarea{width:100%}textarea{min-height:74px;resize:vertical}.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.editor{margin-top:14px;border-top:1px solid #47566a;padding-top:14px}.entry{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #40536b;padding:10px 0}.entry span{overflow-wrap:anywhere;min-width:0}.muted{color:#9eafc7;font-size:12px}.status{min-height:22px;color:#d9edac}@media(max-width:650px){.grid{grid-template-columns:1fr}.side{min-height:210px}main{padding:12px}}
</style></head><body data-bey-mode="extra"><main><header><strong>BEY LAB · EXTRA MODE</strong><a href="./index.html?home=1">⌂ ホームへ</a></header><div class="top"><div><div class="sub">EXTRA MODE / FUN EXPERIMENT</div><h1>🎲 お題箱</h1></div><span class="badge">試作</span></div><p class="sub">戦績とは独立した、おふざけ実験室。X側はカスタム、B側はプレイヤーへのお題。安全に遊ぼう。</p>
<section class="panel"><div class="settings"><label for="level">難易度</label><select id="level"><option value="all">MIX（すべて）</option><option value="normal">NORMAL</option><option value="hard">HARD</option><option value="chaos">CHAOS</option></select><span class="muted">お題はこの端末に保存</span></div><div class="grid"><article class="side x"><h2>X SIDE</h2><div class="kind">カスタムのお題 <span id="xLevel"></span></div><div class="prompt" id="xPrompt"></div><button data-draw="x">🔀 X側を引き直す</button></article><article class="side b"><h2>B SIDE</h2><div class="kind">プレイヤーのお題 <span id="bLevel"></span></div><div class="prompt" id="bPrompt"></div><button data-draw="b">🔀 B側を引き直す</button></article></div><button class="primary full" id="both">🎲 両方のお題を更新</button><p class="muted" style="text-align:center">対戦記録には影響しません。無理な姿勢や危険なシュートは避けてね。</p></section>
<section class="panel"><h2>✏️ お題を追加・編集</h2><div class="settings"><label for="category">対象</label><select id="category"><option value="x">X SIDE · カスタム</option><option value="b">B SIDE · プレイヤー</option></select><label for="newLevel">難易度</label><select id="newLevel"><option value="normal">NORMAL</option><option value="hard">HARD</option><option value="chaos">CHAOS</option></select></div><div class="editor"><textarea id="newText" maxlength="160" placeholder="例：ドラン系ブレードを使ったスタミナカスタムを作れ"></textarea><button class="primary" id="add">＋ お題を登録</button></div><h3>登録済みのお題 <span id="count"></span></h3><div id="entries"></div><p class="status" id="status" aria-live="polite"></p></section></main><script>
(()=>{"use strict";const KEY="bey-lab-extra-prompts-v1";const defaults=[
{id:"x1",side:"x",level:"normal",text:"ドラン系ブレードを使ったカスタムを作れ"},
{id:"x2",side:"x",level:"normal",text:"スタミナタイプのカスタムを作れ"},
{id:"x3",side:"x",level:"hard",text:"アタック型ブレードを使って持久戦向けのカスタムを作れ"},
{id:"x4",side:"x",level:"hard",text:"いつも使わないラチェットを使ってカスタムを作れ"},
{id:"x5",side:"x",level:"chaos",text:"目を閉じてパーツを1つ選び、それを必ず使え"},
{id:"b1",side:"b",level:"normal",text:"利き手と逆の手でランチャーを持ってシュートせよ"},
{id:"b2",side:"b",level:"normal",text:"いつもより弱めのシュートで戦え"},
{id:"b3",side:"b",level:"hard",text:"対戦前に相手の勝ち筋をひとつ予想せよ"},
{id:"b4",side:"b",level:"hard",text:"最初の1戦は普段使わないランチャーの持ち方で挑め"},
{id:"b5",side:"b",level:"chaos",text:"必殺技の名前を宣言してからシュートせよ"}];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let items;try{items=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(items))items=null}catch(e){items=null}items=items||defaults.map(x=>({...x}));let last={x:"",b:""};
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){$("status").textContent="保存できませんでした。空き容量を確認してください。";return false}}
function draw(side){const level=$("level").value;let pool=items.filter(x=>x.side===side&&(level==="all"||x.level===level));if(!pool.length){$(side+"Prompt").textContent="この難易度のお題はまだありません";$(side+"Level").textContent="";return}const different=pool.filter(x=>x.id!==last[side]);if(different.length)pool=different;const chosen=pool[Math.floor(Math.random()*pool.length)];last[side]=chosen.id;$(side+"Prompt").textContent=chosen.text;$(side+"Level").textContent="· "+chosen.level.toUpperCase()}
function render(){const side=$("category").value;const selected=items.filter(x=>x.side===side);$("count").textContent="("+selected.length+"件)";$("entries").innerHTML=selected.map(x=>'<div class="entry"><span><span class="muted">'+x.level.toUpperCase()+'</span> '+esc(x.text)+'</span><div class="row"><button class="small" data-edit="'+esc(x.id)+'">編集</button><button class="small" data-delete="'+esc(x.id)+'">削除</button></div></div>').join("")||'<p class="muted">まだありません</p>'}
document.addEventListener("click",e=>{const d=e.target.closest("[data-draw]");if(d)draw(d.dataset.draw);const del=e.target.closest("[data-delete]");if(del){const item=items.find(x=>x.id===del.dataset.delete);if(item&&confirm("このお題を削除しますか？")){items=items.filter(x=>x.id!==item.id);save();render();if(last[item.side]===item.id)draw(item.side)}}const edit=e.target.closest("[data-edit]");if(edit){const item=items.find(x=>x.id===edit.dataset.edit);if(!item)return;const value=prompt("お題を編集",item.text);if(value===null)return;const v=value.trim().slice(0,160);if(!v)return;item.text=v;save();render();if(last[item.side]===item.id)$(item.side+"Prompt").textContent=v}});
$("both").addEventListener("click",()=>{draw("x");draw("b")});$("level").addEventListener("change",()=>{draw("x");draw("b")});$("category").addEventListener("change",render);$("add").addEventListener("click",()=>{const value=$("newText").value.trim().slice(0,160);if(!value)return;const side=$("category").value;items.push({id:"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),side,level:$("newLevel").value,text:value});if(save()){$("newText").value="";$("status").textContent="✓ お題を登録しました";render()}});render();draw("x");draw("b");
})();
</script><script src="./bey-universal.js"></script></body></html>
