</style></head><body>
<div class="wrap">
<header>
 <div class="brand"><span class="brandmark">⟳</span><div><strong>BEY LAB</strong><small>KING OF THE STADIUM · ARENA β</small></div></div>
 <div class="top-actions"><span class="status" id="saved">端末内保存</span><button class="minibtn accent" data-action="edit">⚙ 登録・並べ替え</button><button class="minibtn" data-action="history">📖 履歴</button><a class="minibtn" href="./index.html">旧画面 ↗</a></div>
</header>
<div class="rotate">📱 横向きでの利用をおすすめします（この画面は横スクロール可能）。</div>
<div class="arena" id="arena">
 <section id="left" class="fighter" aria-label="左サイド"></section>
 <section class="center" aria-label="スコア">
  <div class="center-top"><small>LIVE SCORE</small><button class="swap" data-action="swap">⇄ B/X 入れ替え</button></div>
  <div class="vs">KING OF THE STADIUM</div>
  <div class="scoreline"><strong class="score red" id="leftScore">0</strong><span class="dash">—</span><strong class="score blue" id="rightScore">0</strong></div>
  <div class="scorecontrols">
   <button id="leftPlus" class="add" data-action="plus-left">左 ＋1</button><button id="rightPlus" class="add" data-action="plus-right">右 ＋1</button>
   <button data-action="minus-left">左 −1</button><button data-action="minus-right">右 −1</button>
  </div>
  <div class="rounds"><div class="counter" id="matchCount">0 FINISHES</div><p>ボタン1つで勝敗＋得点を記録</p><strong>⚡ VS ⚡</strong></div>
 </section>
 <section id="right" class="fighter x" aria-label="右サイド"></section>
</div>
<div class="actions" id="finishActions"></div>
<div class="bottom">
 <span class="notice" id="resultNotice" aria-live="polite">ブレードを選んで、勝った側のフィニッシュを押せ！</span>
 <button class="minibtn" data-action="undo">↶ 取り消す</button>
 <button class="minibtn" data-action="new-game">＋ 新しい対戦</button>
</div>
<footer>© BEY LAB · 対戦ボード β版。得点・試合結果はこの端末に保存。既存の「分析」データとは別管理です。大事な記録は履歴からバックアップを。<br>ブレード名やプレイヤー名は自由に登録・変更可能。横画面でお楽しみください。</footer>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<script>
(function(){
"use strict";
const KEY="bey-lab-arena-v1", OLD="bey-lab-recorder-v1";
const FIN=[["spin","スピン",1,"◉"],["over","オーバー",2,"↗"],["burst","バースト",2,"✦"],["extreme","エクストリーム",3,"⚡"]];
const defaults=["ドランストライク","エアロペガサス","シルバーウルフ","コバルトドラグーン","ドランブレイブ","ラスタードラグーン"];
const ids=x=>document.getElementById(x);
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=x=>typeof x==="string"?x.trim().slice(0,70):"";
function initial(){
 let bladeList=defaults.slice();
 try{const old=JSON.parse(localStorage.getItem(OLD));if(old&&Array.isArray(old.beys)){for(const b of old.beys){const base=clean(b).replace(/\s+\d+-\d+\S*$/,"");if(base&&!bladeList.includes(base))bladeList.push(base);}}}catch(e){}
 return {players:["自分","けーくん","おっすん"],blades:bladeList.slice(0,150),slots:{B:{player:"自分",blade:"ドランストライク"},X:{player:"けーくん",blade:"エアロペガサス"}},scores:{B:0,X:0},flipped:false,events:[],sessions:[]};
}
let state=initial(),undo=[];
try{let old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.players)&&Array.isArray(old.blades)&&old.slots&&old.scores&&Array.isArray(old.events)&&Array.isArray(old.sessions)){state=old;}}catch(e){}
state.players=state.players.filter(x=>typeof x==="string"&&x.length<=70).slice(0,120);
state.blades=state.blades.filter(x=>typeof x==="string"&&x.length<=70).slice(0,200);
if(!state.players.length)state.players=["自分"];if(!state.blades.length)state.blades=["ドランストライク"];
for(const side of ["B","X"]){if(!state.slots[side])state.slots[side]={player:state.players[0],blade:state.blades[0]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));ids("saved").textContent="✓ 保存済み"}catch(e){ids("saved").textContent="保存できません";ids("resultNotice").textContent="⚠ 保存失敗。履歴からバックアップを保存してください"}}
function snapshot(){undo.push(JSON.stringify(state));if(undo.length>30)undo.shift()}
function sides(){return state.flipped?["X","B"]:["B","X"]}
function playerButton(name,side){const on=state.slots[side].player===name;return '<button class="pick'+(on?' on':'')+'" type="button" data-action="choose" data-kind="player" data-side="'+side+'" data-value="'+esc(name)+'">'+esc(name)+'</button>'}
function bladeButton(name,side){const on=state.slots[side].blade===name;return '<button class="pick'+(on?' on':'')+'" type="button" data-action="choose" data-kind="blade" data-side="'+side+'" data-value="'+esc(name)+'">'+esc(name)+'</button>'}
function renderFighter(id,side){let el=ids(id);el.className="fighter"+(side==="X"?" x":"");const slot=state.slots[side];el.innerHTML='<div class="fhead"><div><div class="side">'+side+'-SIDE</div><div class="subhead">BLADE FIGHTER</div></div><span class="role">'+(side==="B"?"🔥 RED":"❄ BLUE")+'</span></div><div class="fbody">'+
'<div class="eyebrow">プレイヤー名</div><div class="selected"><span class="gem">◆</span>'+esc(slot.player)+'</div>'+
'<div class="listlabel"><span>登録済みプレイヤー</span><button type="button" data-action="edit">＋ 編集</button></div><div class="picklist">'+state.players.map(v=>playerButton(v,side)).join('')+'</div>'+
'<div class="eyebrow">ブレード名</div><div class="selected"><span class="gem">◉</span>'+esc(slot.blade)+'</div>'+
'<div class="listlabel"><span>登録済みブレード</span><button type="button" data-action="edit">＋ 編集</button></div><div class="picklist">'+state.blades.map(v=>bladeButton(v,side)).join('')+'</div></div>';}
function render(){const [left,right]=sides();renderFighter("left",left);renderFighter("right",right);
ids("leftScore").textContent=state.scores[left];ids("rightScore").textContent=state.scores[right];
ids("leftScore").className="score "+(left==="B"?"red":"blue");ids("rightScore").className="score "+(right==="B"?"red":"blue");
ids("leftPlus").textContent=left+" ＋1";ids("rightPlus").textContent=right+" ＋1";
ids("matchCount").textContent=state.events.filter(x=>x.type==="finish").length+" FINISHES";
ids("finishActions").innerHTML=[left,right].map(side=>'<section class="actionbox'+(side==="X"?" x":"")+'"><div class="actheader">'+side+'-SIDE WIN <small>フィニッシュを選択</small></div><div class="actiongrid">'+FIN.map(f=>'<button class="finishbtn" data-action="finish" data-side="'+side+'" data-finish="'+f[0]+'">'+f[3]+' '+f[1]+'<small>＋'+f[2]+'点</small></button>').join('')+'</div></section>').join('');}
function sideAction(side,type,points,finish){snapshot();const slot=state.slots[side];state.scores[side]=Math.max(0,Number(state.scores[side]||0)+points);
const other=side==="B"?"X":"B";
state.events.push({type,side,points,finish:finish||"",time:new Date().toISOString(),player:slot.player,blade:slot.blade,againstPlayer:state.slots[other].player,againstBlade:state.slots[other].blade});
if(state.events.length>5000)state.events=state.events.slice(-5000);save();render();
const label=FIN.find(f=>f[0]===finish);ids("resultNotice").textContent=side+"-SIDE "+slot.player+" / "+slot.blade+" "+(label?label[1]+"勝ち +"+points+"点":"スコア変更 "+(points>0?"+":"")+points);}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function historyHtml(){const rows=state.events.slice(-35).reverse();return '<div class="modalhead"><h2>📖 対戦履歴</h2><button class="minibtn" data-action="close">閉じる</button></div>'+
'<p style="color:#c0d2e6">今回 '+state.events.filter(x=>x.type==="finish").length+'試合 / 保存済み対戦 '+state.sessions.length+'件</p>'+
'<div class="top-actions" style="justify-content:flex-start"><button class="minibtn accent" data-action="export-json">⬇ JSON保存</button><button class="minibtn" data-action="export-csv">⬇ CSV保存</button></div>'+
'<div class="history">'+(rows.length?rows.map(ev=>'<div class="historyrow"><strong>'+esc(ev.side)+'-SIDE '+esc(ev.player)+'</strong> '+(ev.type==="finish"?esc((FIN.find(f=>f[0]===ev.finish)||["","結果"])[1])+"勝ち":"スコア調整")+'　<span class="confirmation">'+(ev.points>0?"+":"")+esc(ev.points)+'点</span><br><small>'+esc(ev.blade)+' vs '+esc(ev.againstBlade)+'</small></div>').join(''):'<p>まだ試合記録はありません。</p>')+'</div><p style="color:#a6bcd4;font-size:11px">JSONはこのアリーナ専用のバックアップ。現行BEY LABの旧形式とは別データです。</p>';}
function editorHtml(){return '<div class="modalhead"><h2>⚙ 登録・並べ替え</h2><button class="minibtn" data-action="close">完了</button></div><p style="color:#adbed6;font-size:12px">各項目は名前の変更・上下移動が可能。並び順がB/X両側に反映されます。</p><div class="editgrid">'+["player","blade"].map(kind=>{const list=kind==="player"?state.players:state.blades;const title=kind==="player"?"プレイヤー":"ブレード";return '<section class="editgroup"><strong>'+title+'</strong>'+list.map((name,i)=>'<div class="editrow"><span>'+esc(name)+'</span><button class="smallaction" title="名前変更" data-action="rename" data-kind="'+kind+'" data-index="'+i+'">✎</button><button class="smallaction" title="上へ" data-action="move" data-kind="'+kind+'" data-index="'+i+'" data-dir="-1" '+(i===0?"disabled":"")+'>↑</button><button class="smallaction" title="下へ" data-action="move" data-kind="'+kind+'" data-index="'+i+'" data-dir="1" '+(i===list.length-1?"disabled":"")+'>↓</button></div>').join('')+'<form class="editform" data-form="'+kind+'"><input type="search" autocomplete="off" autocorrect="off" spellcheck="false" name="roster-'+kind+'" maxlength="70" placeholder="'+title+'名を追加" required><button class="minibtn accent" type="submit">＋</button></form></section>'}).join('')+'</div>';}
function showModal(mode){ids("overlay").classList.add("show");ids("modal").innerHTML=mode==="edit"?editorHtml():historyHtml();}
function closeModal(){ids("overlay").classList.remove("show");ids("modal").innerHTML="";}
function roster(kind){return kind==="player"?state.players:state.blades}
function addRoster(kind,name){const list=roster(kind);name=clean(name);if(!name||list.includes(name)||list.length>=200)return false;snapshot();list.push(name);save();render();return true}
function renameRoster(kind,i){const list=roster(kind),prior=list[i];if(prior==null)return;const incoming=prompt("新しい"+(kind==="player"?"プレイヤー":"ブレード")+"名",prior);if(incoming==null)return;const name=clean(incoming);if(!name||name===prior||list.includes(name))return;snapshot();list[i]=name;for(const s of ["B","X"]){if(state.slots[s][kind]===prior)state.slots[s][kind]=name}save();render();showModal("edit")}
function moveRoster(kind,i,dir){const list=roster(kind),j=i+dir;if(i<0||j<0||i>=list.length||j>=list.length)return;snapshot();[list[i],list[j]]=[list[j],list[i]];save();render();showModal("edit")}
function exportCsv(){const records=state.sessions.flatMap(s=>s.events.concat([])).concat(state.events);const header=["日時","サイド","勝者","ブレード","相手","相手のブレード","結果","得点"];const q=t=>'"'+String(t==null?"":t).replace(/"/g,'""')+'"';const body=records.filter(x=>x.type==="finish").map(x=>[x.time,x.side,x.player,x.blade,x.againstPlayer,x.againstBlade,(FIN.find(f=>f[0]===x.finish)||["",""])[1],x.points].map(q).join(","));download("bey-lab-arena.csv","\ufeff"+[header.map(q).join(","),...body].join("\r\n"),"text/csv;charset=utf-8")}
document.addEventListener("click",e=>{
const b=e.target.closest("[data-action]");if(!b)return;const action=b.dataset.action,side=b.dataset.side,kind=b.dataset.kind;
if(action==="choose"){snapshot();state.slots[side][kind]=b.dataset.value;save();render();}
else if(action==="finish"){const f=FIN.find(x=>x[0]===b.dataset.finish);if(f)sideAction(side,"finish",f[2],f[0]);}
else if(action==="plus-left"||action==="plus-right"||action==="minus-left"||action==="minus-right"){const isLeft=action.endsWith("left");const target=sides()[isLeft?0:1];const point=action.startsWith("plus")?1:-1;if(point<0&&!state.scores[target])return;sideAction(target,"adjust",point);}
else if(action==="swap"){snapshot();state.flipped=!state.flipped;save();render();}
else if(action==="undo"){if(!undo.length){ids("resultNotice").textContent="取り消せる操作がありません";return;}state=JSON.parse(undo.pop());save();render();ids("resultNotice").textContent="直前の操作を取り消しました";}
else if(action==="new-game"){if(!confirm("現在のスコアを終了し、新しい対戦を始めますか？\n終了した試合は履歴に残ります。"))return;snapshot();if(state.events.length||state.scores.B||state.scores.X){state.sessions.push({finished:new Date().toISOString(),events:state.events.slice(),scores:{...state.scores}});if(state.sessions.length>200)state.sessions.shift()}state.events=[];state.scores={B:0,X:0};save();render();ids("resultNotice").textContent="新しい対戦を開始！";}
else if(action==="edit"||action==="history")showModal(action);
else if(action==="close")closeModal();
else if(action==="rename")renameRoster(kind,Number(b.dataset.index));
else if(action==="move")moveRoster(kind,Number(b.dataset.index),Number(b.dataset.dir));
else if(action==="export-json")download("bey-lab-arena-backup.json",JSON.stringify(state,null,2),"application/json;charset=utf-8");
else if(action==="export-csv")exportCsv();
});
ids("modal").addEventListener("submit",e=>{const form=e.target.closest("form[data-form]");if(!form)return;e.preventDefault();const input=form.querySelector("input");if(addRoster(form.dataset.form,input.value)){showModal("edit");}else{alert("登録済みか、名前が空欄です。別の名前を入力してください。")}});
ids("overlay").addEventListener("click",e=>{if(e.target===ids("overlay"))closeModal()});
render();if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script></body></html>
