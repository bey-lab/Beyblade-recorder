<script src="./bey-hands.js?v=mickey17-20261017-02"></script><script>
(function(){"use strict";
const H=window.BEY_HANDS,ENV=localStorage.getItem("bey-lab-environment-v1"),env=ENV==="official"?"official":"test",KEY="bey-lab-arena-v2-"+env;
const $=id=>document.getElementById(id),date=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")},id=()=>crypto?.randomUUID?.()||Date.now()+"-"+Math.random().toString(36).slice(2),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),copy=o=>JSON.parse(JSON.stringify(o));
const diagLines=[];let diagOp=0,diagLastSave="not attempted";
function diag(t){try{diagLines.unshift(new Date().toLocaleTimeString("ja-JP")+" "+t);diagLines.length=Math.min(diagLines.length,60);const el=document.getElementById("diagLog");if(el)el.textContent=diagLines.join("\n")}catch(_){}}
window.addEventListener("error",e=>diag("✖ ERROR "+(e.message||"unknown")+" @"+(e.filename||"?")+":"+e.lineno));
window.addEventListener("unhandledrejection",e=>diag("✖ REJECT "+String(e.reason?.stack||e.reason||"unknown")));
function summaryState(){try{const b=state?.slots?.B,x=state?.slots?.X,r=room();return "B="+(b?.player||"-")+"/"+(b?.blade||"-")+"/"+(b?.ratchet||"-")+"/"+(b?.bit||"-")+" X="+(x?.player||"-")+"/"+(x?.blade||"-")+"/"+(x?.ratchet||"-")+"/"+(x?.bit||"-")+" results="+(r?.results?.length||0)+" room="+(r?.date||"-")+" overlay="+(!document.getElementById("overlay")?.hidden?"open":"closed")}catch(e){return "unavailable: "+e.message}}
function trackAction(action){const n=++diagOp,before=summaryState();diag("#"+n+" ① ACTION "+action);diag("#"+n+" ② BEFORE "+before);diagLastSave="not attempted";setTimeout(()=>{const after=summaryState();diag("#"+n+" ⑤ AFTER "+after+" | changed="+(before!==after?"YES":"NO")+" | save="+diagLastSave);if(before===after&&diagLastSave==="not attempted")diag("#"+n+" NOTE no state change or app save observed")},0)}
document.addEventListener("click",e=>{const btn=e.target.closest?.("button");if(!btn)return;const d=btn.dataset;trackAction([d.kind||d.finish||d.toggle||d.loadpreset||d.savepreset||btn.id||"button",d.side||d.toggle||d.loadpreset||d.savepreset||"",d.value||d.index||btn.textContent.trim().slice(0,25)].filter(Boolean).join(" "))},true);
document.addEventListener("change",e=>{const el=e.target;if(el.matches("select"))trackAction("CHANGE "+(el.dataset.part||el.id||"select")+" "+(el.dataset.side||"")+" "+el.value)},true);
const finishes=[["spin","スピン","◉"],["over","オーバー","↗"],["burst","バースト","✦"],["extreme","エクストリーム","⚡"]];
const roster=()=>H?.players()||[],hand=(p,k)=>{const registered=H?.read()?.[p];return registered?H?.get(p,k)||[]:H?.pool(k)||[]},blades=p=>hand(p,"blade"),parts=(p,k)=>hand(p,k),baseSlot=p=>({player:p||"",blade:blades(p)[0]||"",ratchet:"",bit:""});
function init(){const p=roster();return {version:1,rooms:[],activeRoomId:null,slots:{B:baseSlot(p[0]),X:baseSlot(p[1]||p[0])},lastBuild:{}}}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||state.version!==1||!Array.isArray(state.rooms)||!state.slots)state=init();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));diagLastSave="OK";diag("③ SAVE OK "+KEY);return true}catch(e){diagLastSave="ERROR";diag("✖ SAVE ERROR "+e.message);$("notice").textContent="⚠ 保存できません。端末の空き容量を確認してください";return false}}
function room(){return state.rooms.find(r=>r.id===state.activeRoomId)}
function newRoom(){const r={id:id(),date:date(),created:new Date().toISOString(),results:[]};state.rooms.push(r);state.activeRoomId=r.id;return r}
function ensureRoom(){const r=room();if(!r){newRoom();save();return}if(r.date!==date()&&!r.manualResume){const same=state.rooms.find(x=>x.date===date()&&!x.manualResume);if(same)state.activeRoomId=same.id;else newRoom();save()}}
ensureRoom();
// Repair empty selections left by the first prototype; never touch shared 1on1 data.
for(const side of ["B","X"]){const slot=state.slots[side];if(slot?.player&&!slot.blade){slot.blade=blades(slot.player)[0]||""}}save();
function allPlayers(){return [...new Set([...roster(),...Object.values(state.slots).map(x=>x.player).filter(Boolean)])]}
function slotSnapshot(s){return copy(state.slots[s])}
function currentResults(){return room()?.results||[]}
function streak(player,blade){let p=0,b=0,bladeRunning=true;for(const r of currentResults().slice().reverse()){if(r.winner.player!==player)break;p++;if(bladeRunning&&r.winner.blade===blade)b++;else bladeRunning=false}return {player:p,blade:b}}
function build(s){const v=state.slots[s];return [v.blade,v.ratchet,v.bit].filter(Boolean).join(" / ")||"ブレード未選択"}
const expanded={B:false,X:false};
function renderSide(s){const v=state.slots[s],players=allPlayers(),list=[...new Set([...blades(v.player),v.blade].filter(Boolean))],r=streak(v.player,v.blade);
const btn=(kind,name,active)=>'<button class="pick '+(active?"active":"")+'" data-kind="'+kind+'" data-side="'+s+'" data-value="'+esc(name)+'">'+esc(name)+'</button>';
const select=k=>{const integrated=k==="ratchet"&&(H?.integrated?.("blade",v.blade)||H?.integrated?.("bit",v.bit));const owned=H?.get(v.player,k)||[];const values=integrated?[]:[...new Set([...owned,v[k]].filter(Boolean))];const none='<button type="button" class="pick '+(!v[k]?"active":"")+'" data-kind="'+k+'" data-side="'+s+'" data-value="">指定なし</button>';return '<div class="caption">'+(k==="ratchet"?"ラチェット":"ビット")+' / '+(integrated?"内蔵":"登録済み "+owned.length)+'</div><div class="picks">'+(integrated?'<span class="muted">ラチェット内蔵</span>':none+values.map(x=>'<button type="button" class="pick '+(v[k]===x?"active":"")+'" data-kind="'+k+'" data-side="'+s+'" data-value="'+esc(x)+'">'+esc(x)+'</button>').join(""))+'</div>'};
const summary='<div class="build" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div><small style="display:block">現在のカスタム</small>'+esc(build(s))+'</div><button class="button" data-toggle="'+s+'">'+(expanded[s]?"▲ 閉じる":"▦ 機体を変更")+'</button></div>';
const details=expanded[s]?'<div class="caption">ブレード</div><div class="picks">'+list.map(b=>btn("blade",b,b===v.blade)).join("")+'</div>'+select("ratchet")+select("bit")+'<div class="caption">保存済み完成ベイ / '+(H?.presetsGet(v.player)||[]).length+'機</div><div class="picks">'+(H?.presetsGet(v.player)||[]).map((p,i)=>'<button class="pick" data-loadpreset="'+s+'" data-index="'+i+'">'+esc([p.blade,p.ratchet||(H?.integrated?.("blade",p.blade)||H?.integrated?.("bit",p.bit)?"内蔵":""),p.bit].filter(Boolean).join(" · "))+'</button>').join("")+'</div><div class="toolbar"><button class="button preset" data-savepreset="'+s+'">＋ 現在の機体を保存</button></div>':"";
$("fighter"+s).innerHTML='<div class="side">'+s+'-SIDE</div><div class="caption">プレイヤー</div><div class="picks">'+players.map(p=>btn("player",p,p===v.player)).join("")+'</div><div class="caption"><a href="./hands.html?player='+encodeURIComponent(v.player)+'">🃏 手札管理</a></div>'+summary+details;
return '<div class="streak '+(s==="X"?"x":"")+'"><div class="who">'+esc(v.player||"未選択")+'</div><div class="num">'+r.player+'<span style="font-size:.25em"> 連勝</span></div><div class="sub">'+esc(v.blade||"—")+' · '+r.blade+'連勝</div></div>'}
function render(){diag("④ RENDER 開始");const r=room();$("roomTitle").textContent=r?.date+" の大会";$("roomSub").textContent=(r?.results.length||0)+" 戦 · "+(r?.manualResume?"過去大会を再開中":"日付別の自動大会");$("roomSelect").innerHTML=state.rooms.slice().reverse().map(x=>'<option value="'+x.id+'" '+(x.id===state.activeRoomId?"selected":"")+'>'+x.date+' ('+x.results.length+'戦)'+(x.manualResume?" ↩":"")+'</option>').join("");$("streakboard").innerHTML=renderSide("B")+renderSide("X");$("finishgrid").innerHTML=["B","X"].map(s=>'<div class="finishgroup '+(s==="X"?"x":"")+'"><h3>'+s+'-SIDE · '+esc(state.slots[s].player)+'</h3><div class="pads">'+finishes.map(f=>'<button class="finish" data-finish="'+f[0]+'" data-side="'+s+'" '+(!state.slots.B.player||!state.slots.X.player?"disabled":"")+'>'+f[2]+' '+f[1]+'<small>勝利を記録</small></button>').join("")+'</div></div>').join("");
const res=currentResults(),count={};for(const x of res){for(const p of [x.winner.player,x.loser.player])count[p]??={w:0,l:0,max:0};count[x.winner.player].w++;count[x.loser.player].l++}
$("stats").innerHTML=Object.entries(count).sort((a,b)=>b[1].w-a[1].w).map(([p,v])=>'<div class="entry"><strong>'+esc(p)+'</strong>　'+v.w+'勝 '+v.l+'敗 · 勝率 '+Math.round(100*v.w/(v.w+v.l))+'%</div>').join("")||'<div class="muted">まだ対戦記録がありません。</div>';
$("history").innerHTML=res.slice().reverse().slice(0,70).map((x,i)=>'<div class="entry"><strong>#'+(res.length-i)+' '+esc(x.winner.player)+'</strong>　'+esc(finishes.find(f=>f[0]===x.finish)?.[1]||"")+'勝利<br><span class="muted">'+esc(x.winner.blade)+' vs '+esc(x.loser.blade)+' · '+new Date(x.time).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+'</span></div>').join("")||'<div class="muted">まだ記録がありません。</div>'}

function validate(){for(const s of ["B","X"]){const v=state.slots[s];if(!v.player){notice("プレイヤーを選択してください");return false}if(H?.ratchetStatus?.(v.blade,v.ratchet,v.bit)==="conflict"){notice("一体型ラチェットの構成が競合しています");return false}if(H?.integrated?.("blade",v.blade)&&v.ratchet){notice("ラチェット一体型ブレードでは別ラチェットを選べません");return false}if(H?.integrated?.("bit",v.bit)&&v.ratchet){notice("ラチェット一体型ビットでは別ラチェットを選べません");return false}}return true}

const royalMemoryKey="bey-lab-royal-remarks-v1-"+env;
let royalRecent={};try{const saved=JSON.parse(localStorage.getItem(royalMemoryKey));if(saved&&typeof saved==="object"&&!Array.isArray(saved))royalRecent=saved}catch(e){}
function royalTier(n){return Math.min(Math.max(n,1),10)-1}
function royalLook(n){if(n>=8)return {rank:"skull",symbol:"💀",name:"暴君の時代",color:"#f1788d"};if(n>=6)return {rank:"fire",symbol:"🔥",name:"王国危機",color:"#ff9a60"};if(n>=4)return {rank:"gold",symbol:"♛",name:"王権拡大",color:"#f3d18d"};if(n>=3)return {rank:"gold",symbol:"♛",name:"黄金の王冠",color:"#f3d18d"};if(n===2)return {rank:"silver",symbol:"♛",name:"銀の王冠",color:"#c7d5e5"};return {rank:"bronze",symbol:"♛",name:"銅の王冠",color:"#d69a6b"}}
function royalComment(n){const tier=royalTier(n),list=royalLines[tier],used=Array.isArray(royalRecent[tier])?royalRecent[tier]:[];let options=list.filter(x=>!used.includes(x));if(!options.length){used.length=0;options=list}const choice=options[Math.floor(Math.random()*options.length)];used.push(choice);royalRecent[tier]=used.slice(-Math.min(24,list.length-1));try{localStorage.setItem(royalMemoryKey,JSON.stringify(royalRecent))}catch(e){}return choice}
